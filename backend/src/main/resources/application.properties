spring.application.name=backend

# ---------------------------------------------------------------------------
# Database connection — set these environment variables in your deployment
# environment or local .env / IDE run configuration:
#   DB_URL      e.g. jdbc:postgresql://host:5432/dbname
#   DB_USERNAME e.g. postgres.xxxxxxxxxxxx
#   DB_PASSWORD e.g. your-supabase-password
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# Flyway: owns the database schema (creates/migrates tables).
# Hibernate only validates that the schema matches the entity definitions.
# Do NOT use ddl-auto=update or ddl-auto=create alongside Flyway.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true