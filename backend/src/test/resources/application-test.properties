# ---------------------------------------------------------------------------
# Test profile — used by @ActiveProfiles("test") in test classes.
# Uses an H2 in-memory database in PostgreSQL compatibility mode so that:
#   1. Tests run locally without any Supabase/network connection.
#   2. Flyway migrations (written in standard SQL) run against H2 and verify
#      that the migration script is syntactically correct.
#   3. JPA entity mappings are validated against the Flyway-created schema.
#
# IMPORTANT: This file is intentionally stored under src/test/resources so
# it is never packaged into the production artifact.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway is enabled and will run migrations from src/main/resources/db/migration/
# This proves the migration script works before it reaches the production database.
spring.flyway.enabled=true

# Hibernate validates the schema created by Flyway — it does NOT create or alter tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
